<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>麻雀與食飯抽水結算系統</title>
    <link rel="stylesheet" href="tailwind.css">
    <style>
        body.py-8 { padding-top: max(2rem, calc(env(safe-area-inset-top) + 0.75rem)); padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
        /* 16px 以上，避免 iPhone 撳輸入框時自動放大畫面 */
        input, select { font-size: 16px; }
        /* 人員格仔：長按拖拉 */
        .unit { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; cursor: grab; transition: transform .12s, box-shadow .12s; }
        .unit img { pointer-events: none; -webkit-user-drag: none; }
        .unit.dragging-src { opacity: .3; }
        .unit.drop-target { box-shadow: 0 0 0 3px #6366f1; background: #eef2ff; transform: scale(1.04); }
        /* 圓形 + 新增掣 */
        .plus-btn { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 9999px; background: #4f46e5; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
        .plus-btn:active { background: #4338ca; }
        .plus-btn svg { width: 20px; height: 20px; }
        .plus-btn.plus-sm { width: 28px; height: 28px; }
        .plus-btn.plus-sm svg { width: 16px; height: 16px; }
        .plus-btn.plus-lg { width: 72px; height: 72px; }
        .plus-btn.plus-lg svg { width: 36px; height: 36px; }
        /* 個人明細表：左右捲動時鎖死最左邊名字欄 */
        #summary-table th:first-child, #summary-table td:first-child { position: sticky; left: 0; box-shadow: 2px 0 4px -2px rgba(0,0,0,.18); }
        #summary-table th:first-child { z-index: 2; background: #f1f5f9; }
        #summary-table td:first-child { z-index: 1; background: #fff; }
        #summary-table tr:hover td:first-child { background: #f8fafc; }
        #drag-ghost { position: fixed; z-index: 70; pointer-events: none; opacity: .92; transform: scale(1.1); box-shadow: 0 10px 25px rgba(0,0,0,.25); background: #fff; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto space-y-6">

        <!-- 標題 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
            <h1 class="text-2xl font-bold text-slate-900">🀄️麻雀與食飯抽水結算系統</h1>
            <p class="text-sm text-slate-500 mt-1">支援中途換人、抽水計飯錢同結算</p>
        </div>

        <!-- 錯誤警告容器 -->
        <div id="error-container" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-xl shadow-sm">
            <div class="flex">
                <div class="flex-shrink-0 text-red-500 font-bold">⚠️ 注意：</div>
                <div class="ml-3 text-sm text-red-700 font-medium" id="error-message"></div>
            </div>
        </div>

        <!-- 人員設定 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div>
                <h2 class="text-lg font-semibold text-slate-800">🐷人數設定</h2>
                <p class="text-xs text-slate-500 mt-1.5">定好人數後，可以個人或組別結算</p>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-50 rounded-xl border p-3 text-center">
                    <div class="text-xs text-slate-500">麻雀枱數</div>
                    <div id="stat-tables" class="text-xl font-bold text-slate-800 mt-0.5">0</div>
                </div>
                <div class="bg-slate-50 rounded-xl border p-3 text-center">
                    <div class="text-xs text-slate-500">齋食飯人數</div>
                    <div id="stat-diners" class="text-xl font-bold text-slate-800 mt-0.5">0</div>
                </div>
            </div>
            <p class="text-sm text-slate-600">總人數：<span id="stat-people" class="font-bold text-slate-800">0</span> 人</p>

            <div id="people-container" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-1"></div>
        </div>

        <!-- 設定區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 齋食飯名單 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-slate-800">🍲 齋食飯名單</h2>
                    <button onclick="openPureDinnerPicker()" class="plus-btn" title="由人員名單加入" aria-label="由人員名單加入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                </div>
                <div class="space-y-3">
                    <div id="pure-dinners-container" class="flex flex-wrap gap-2"></div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">飯錢計算方法</label>
                        <select id="dinner-mode" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" onchange="changeDinnerMode(this.value)">
                            <option value="subsidy">參與抽水補貼</option>
                            <option value="pure">無抽水補貼（純計飯錢）</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 已出食飯錢設定 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-slate-800">💰 已付食飯錢記錄</h2>
                    <button onclick="addPaidDinnerRow()" class="plus-btn" title="新增記錄" aria-label="新增記錄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                </div>
                <div id="paid-dinners-container" class="space-y-2 max-h-52 overflow-y-auto pr-1">
                    <!-- 動態加入 -->
                </div>
                <div class="mt-3 pt-2 border-t flex justify-between items-center text-sm font-semibold">
                    <span class="text-slate-500">自動加總食飯錢總額：</span>
                    <span id="total-dinner-display" class="text-indigo-600 text-base">$0</span>
                </div>
            </div>
        </div>

        <!-- 麻雀台數管理 (支援中途換人) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4 gap-3">
                <div>
                    <h2 class="text-lg font-semibold text-slate-800">🀄 麻雀台資料 (含中途換人/分段)</h2>
                    <p class="text-xs text-slate-500 mt-0.5">中途換人撳 🔄，揀接替嘅人。</p>
                </div>
                <button onclick="addTable()" class="plus-btn" title="新增麻雀台" aria-label="新增麻雀台"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <div id="tables-container" class="space-y-6">
                <!-- 動態麻雀台 -->
            </div>
        </div>

        <!-- 結算結果 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
            <h2 class="text-lg font-semibold text-slate-800 border-b pb-2">📊 最終結算報告</h2>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                <div class="bg-slate-50 p-4 rounded-xl border">
                    <div class="text-xs text-slate-500">總抽水金額</div>
                    <div id="res-total-commission" class="text-xl font-bold text-slate-800 mt-1">$0</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border">
                    <div class="text-xs text-slate-500">總食飯支出</div>
                    <div id="res-total-dinner" class="text-xl font-bold text-slate-800 mt-1">$0</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border">
                    <div class="text-xs text-slate-500">抽水扣除後差額</div>
                    <div id="res-balance-diff" class="text-xl font-bold text-slate-800 mt-1">$0</div>
                </div>
            </div>

            <!-- 個人明細表格 -->
            <div class="overflow-x-auto">
                <table id="summary-table" class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase">
                            <th class="p-3 rounded-l-xl">名字</th>
                            <th class="p-3">贏輸</th>
                            <th class="p-3">飯錢分擔</th>
                            <th class="p-3">已付飯錢</th>
                            <th class="p-3 rounded-r-xl text-right">最終結果 (收/付)</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body" class="divide-y divide-slate-100">
                        <!-- 動態插入 -->
                    </tbody>
                </table>
            </div>

            <!-- 找數路徑 (以組別計) -->
            <div class="bg-indigo-50/50 p-5 rounded-2xl border border-indigo-100 space-y-4">
                <div>
                    <h3 class="font-semibold text-indigo-900">💸 建議找數方式</h3>
                </div>
                <div id="group-balances" class="space-y-1.5 text-sm"></div>
                <ul id="transactions-list" class="space-y-2 text-sm text-slate-700 pt-3 border-t border-indigo-100">
                    <!-- 動態插入 -->
                </ul>
            </div>

            <!-- 複製按鈕 -->
            <button onclick="shareReportHtml()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-medium hover:bg-slate-800 transition shadow-sm">
                📤 一鍵分享完整結算報告 (HTML)
            </button>
            <button onclick="copyReport()" class="w-full text-slate-500 text-sm underline">只複製文字摘要</button>
        </div>

        <!-- 資料管理 -->
        <div class="flex justify-center gap-4 text-xs text-slate-400">
            <button onclick="loadSample()" class="underline">還原範例資料</button>
            <button onclick="clearAll()" class="underline">清空全部</button>
        </div>

    </div>

    <!-- 確認視窗 -->
    <div id="confirm" class="hidden fixed inset-0 z-[60] bg-black/40 items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-2xl p-5" style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));">
            <h3 id="confirm-title" class="font-semibold text-slate-800 mb-1"></h3>
            <p id="confirm-msg" class="text-sm text-slate-500 mb-4"></p>
            <div class="flex gap-2">
                <button onclick="closeConfirm()" class="flex-1 py-2.5 rounded-xl border text-slate-600">取消</button>
                <button id="confirm-ok" onclick="confirmOk()" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-medium">刪除</button>
            </div>
        </div>
    </div>

    <!-- 點選人員視窗 -->
    <div id="picker" class="hidden fixed inset-0 z-50 bg-black/40 items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl p-5 max-h-[80vh] flex flex-col" style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));">
            <div class="flex justify-between items-center mb-1">
                <h3 id="picker-title" class="font-semibold text-slate-800"></h3>
                <button onclick="closePicker()" class="text-slate-400 text-xl px-2">✕</button>
            </div>
            <p id="picker-hint" class="text-xs text-slate-500 mb-3"></p>
            <div id="picker-grid" class="grid grid-cols-3 gap-3 overflow-y-auto pb-2"></div>
            <div id="picker-footer" class="pt-3 border-t flex gap-2">
                <button onclick="closePicker()" class="flex-1 py-2.5 rounded-xl border text-slate-600">取消</button>
                <button id="picker-ok" onclick="pickerConfirm()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-medium disabled:opacity-40">確定</button>
            </div>
        </div>
    </div>

    <!-- 編輯人員 / 組別視窗 -->
    <div id="sheet" class="hidden fixed inset-0 z-50 bg-black/40 items-end sm:items-center justify-center" onclick="if (event.target === this) closeSheet()">
        <div id="sheet-body" class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5" style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));"></div>
    </div>

    <!-- 調整相片視窗 -->
    <div id="cropper" class="hidden fixed inset-0 z-[60] bg-black/60 items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5" style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));">
            <h3 class="font-semibold text-slate-800 mb-1">調整相片</h3>
            <p class="text-xs text-slate-500 mb-3">拖動相片移位，雙指或下面滑桿縮放，圓形範圍內就係頭像。</p>
            <div class="flex justify-center">
                <div class="relative overflow-hidden rounded-xl bg-slate-200 select-none">
                    <canvas id="crop-canvas" style="display:block; touch-action:none;"></canvas>
                    <div class="absolute inset-0 pointer-events-none rounded-full" style="box-shadow: 0 0 0 999px rgba(0,0,0,.45);"></div>
                </div>
            </div>
            <div class="flex items-center gap-3 mt-4">
                <span class="text-xs text-slate-500">縮放</span>
                <input id="crop-zoom" type="range" min="1" max="5" step="0.01" value="1" class="flex-1" oninput="cropZoom(this.value)">
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="cropCancel()" class="px-4 py-2.5 rounded-xl border text-slate-600">取消</button>
                <button onclick="cropConfirm()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-medium">確定</button>
            </div>
        </div>
    </div>

    <input type="file" id="photo-input" accept="image/*" class="hidden">

    <script>
        const STORAGE_KEY = 'mahjong-calc-v1';
        const AV_COLORS = [
            'bg-rose-100 text-rose-700', 'bg-amber-100 text-amber-700', 'bg-emerald-100 text-emerald-700',
            'bg-sky-100 text-sky-700', 'bg-violet-100 text-violet-700', 'bg-teal-100 text-teal-700',
            'bg-orange-100 text-orange-700', 'bg-pink-100 text-pink-700'
        ];
        // 頭像大細：全部地方統一放大一半 (xl 亦係人數名單用嘅大細)
        const AV_SIZE = {
            xs: 'w-9 h-9 text-base', sm: 'w-14 h-14 text-xl',
            lg: 'w-[72px] h-[72px] text-2xl', xl: 'w-24 h-24 text-4xl'
        };

        let S;                 // 全部資料
        let photoTarget = null;
        let pk = null;         // 點選視窗狀態

        // ---------- 資料 ----------
        function emptyState() {
            return { seq: 1, people: [], tables: [], pureDinners: [], paidDinners: [], dinnerMode: 'subsidy' };
        }
        function uid(prefix) { return prefix + (S.seq++); }
        function seat(personId, wl, sub) { return { personId: personId, wl: wl, sub: !!sub }; }
        function addPerson(name) {
            const id = uid('p');
            S.people.push({ id: id, name: name || '', photo: null, groupId: uid('g'), joinedAt: S.seq++, captain: false });
            return id;
        }
        function P(id) { return S.people.find(p => p.id === id); }
        function named(p) { return p && p.name.trim().length > 0; }
        function nameOf(p) { return named(p) ? p.name.trim() : '未命名'; }
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function sampleState() {
            S = emptyState();
            const id = {};
            ['Sam', 'Eddie', 'Garry', 'Janet', 'Ada', 'Agnes', 'Michelle', 'Venus', 'Homan'].forEach(n => { id[n] = addPerson(n); });
            S.tables = [
                { id: uid('t'), commission: 11.5, seats: [seat(id.Sam, -2.5), seat(id.Eddie, 0), seat(id.Garry, -20), seat(id.Janet, 11)] },
                { id: uid('t'), commission: 12.5, seats: [seat(id.Ada, -10.5), seat(id.Agnes, -14.5), seat(id.Michelle, -0.5), seat(id.Venus, 13)] }
            ];
            S.pureDinners = [id.Homan];
            S.paidDinners = [{ personId: id.Sam, amount: 41 }, { personId: id.Ada, amount: 5 }];
        }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    if (d && Array.isArray(d.people) && Array.isArray(d.tables)) { S = Object.assign(emptyState(), d); return; }
                }
            } catch (e) { /* 讀唔到就用範例 */ }
            sampleState();
        }
        function save() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) { /* 儲存失敗唔影響使用 */ }
        }

        // ---------- 組別 ----------
        function groupsMap() {
            const m = new Map();
            S.people.forEach(p => { if (!m.has(p.groupId)) m.set(p.groupId, []); m.get(p.groupId).push(p); });
            m.forEach(arr => arr.sort((a, b) => a.joinedAt - b.joinedAt));
            return m;
        }
        // 隊長：可以指定；未指定就用第一個加入嘅人。組名同組相片都跟隊長。
        function captainOf(arr) { return arr.find(p => p.captain) || arr[0]; }
        function captainFirst(arr) {
            const c = captainOf(arr);
            return [c].concat(arr.filter(m => m !== c));
        }
        function groupName(gid, gm) {
            const arr = (gm || groupsMap()).get(gid) || [];
            const c = captainOf(arr);
            if (named(c)) return c.name.trim();
            const first = arr.find(named);
            return first ? first.name.trim() : '未命名';
        }

        // ---------- 頭像 ----------
        function avatarHtml(p, size) {
            const sz = AV_SIZE[size || 'sm'];
            if (!p) return `<span class="inline-flex items-center justify-center shrink-0 rounded-full bg-slate-200 text-slate-500 ${sz}">?</span>`;
            if (p.photo) return `<img src="${p.photo}" alt="" class="inline-block shrink-0 rounded-full object-cover ${sz}">`;
            const color = AV_COLORS[(parseInt(p.id.slice(1), 10) || 0) % AV_COLORS.length];
            const initial = named(p) ? Array.from(p.name.trim())[0] : '👤';
            return `<span class="inline-flex items-center justify-center shrink-0 rounded-full font-semibold ${color} ${sz}">${esc(initial)}</span>`;
        }

        // ---------- 相片 ----------
        function pickPhoto(id) {
            photoTarget = id;
            const input = document.getElementById('photo-input');
            input.value = '';
            input.click();
        }
        document.getElementById('photo-input').addEventListener('change', function () {
            const file = this.files && this.files[0];
            if (!file || !photoTarget) return;
            const target = photoTarget;
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = function () { openCropper(img, url, target); };
            img.onerror = function () { URL.revokeObjectURL(url); alert('讀取相片失敗，請揀另一張。'); };
            img.src = url;
        });

        // ---------- 調整相片 (拖動移位 + 縮放) ----------
        let crop = null;
        function clampN(v, a, b) { return Math.min(b, Math.max(a, v)); }
        function openCropper(img, url, target) {
            const V = Math.min(280, window.innerWidth - 80);
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            const min = V / Math.min(img.width, img.height);
            crop = { img: img, url: url, target: target, V: V, dpr: dpr, min: min, scale: min,
                     x: (V - img.width * min) / 2, y: (V - img.height * min) / 2, pts: new Map(), lastDist: 0 };
            const cv = document.getElementById('crop-canvas');
            cv.width = Math.round(V * dpr); cv.height = Math.round(V * dpr);
            cv.style.width = V + 'px'; cv.style.height = V + 'px';
            document.getElementById('crop-zoom').value = 1;
            const el = document.getElementById('cropper');
            el.classList.remove('hidden');
            el.classList.add('flex');
            drawCrop();
        }
        function drawCrop() {
            if (!crop) return;
            const w = crop.img.width * crop.scale, h = crop.img.height * crop.scale;
            crop.x = clampN(crop.x, crop.V - w, 0);
            crop.y = clampN(crop.y, crop.V - h, 0);
            const cv = document.getElementById('crop-canvas');
            const ctx = cv.getContext('2d');
            ctx.setTransform(crop.dpr, 0, 0, crop.dpr, 0, 0);
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(0, 0, crop.V, crop.V);
            ctx.drawImage(crop.img, crop.x, crop.y, w, h);
        }
        // z = 1..5 倍 (1 = 剛好填滿)，以 (cx, cy) 為不動點
        function setCropZoom(z, cx, cy) {
            z = clampN(z, 1, 5);
            const ns = crop.min * z, k = ns / crop.scale;
            crop.x = cx - (cx - crop.x) * k;
            crop.y = cy - (cy - crop.y) * k;
            crop.scale = ns;
            document.getElementById('crop-zoom').value = z;
            drawCrop();
        }
        function cropZoom(v) { if (crop) setCropZoom(parseFloat(v) || 1, crop.V / 2, crop.V / 2); }
        function cropPts() { return Array.from(crop.pts.values()); }
        function cropDist() {
            const a = cropPts();
            return a.length === 2 ? Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) : 0;
        }
        (function () {
            const cv = document.getElementById('crop-canvas');
            cv.addEventListener('pointerdown', e => {
                if (!crop) return;
                crop.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                cv.setPointerCapture(e.pointerId);
                crop.lastDist = cropDist();
            });
            cv.addEventListener('pointermove', e => {
                if (!crop || !crop.pts.has(e.pointerId)) return;
                const prev = crop.pts.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
                if (crop.pts.size === 1) {
                    crop.x += cur.x - prev.x; crop.y += cur.y - prev.y;
                    crop.pts.set(e.pointerId, cur);
                    drawCrop();
                } else {
                    crop.pts.set(e.pointerId, cur);
                    const d = cropDist(), a = cropPts(), r = cv.getBoundingClientRect();
                    if (crop.lastDist > 0 && d > 0) {
                        setCropZoom(crop.scale / crop.min * (d / crop.lastDist),
                            (a[0].x + a[1].x) / 2 - r.left, (a[0].y + a[1].y) / 2 - r.top);
                    }
                    crop.lastDist = d;
                }
            });
            const up = e => { if (crop) { crop.pts.delete(e.pointerId); crop.lastDist = cropDist(); } };
            cv.addEventListener('pointerup', up);
            cv.addEventListener('pointercancel', up);
            cv.addEventListener('wheel', e => {
                if (!crop) return;
                e.preventDefault();
                const r = cv.getBoundingClientRect();
                setCropZoom(crop.scale / crop.min * (e.deltaY < 0 ? 1.1 : 0.9), e.clientX - r.left, e.clientY - r.top);
            }, { passive: false });
        })();
        function closeCropper() {
            if (crop) URL.revokeObjectURL(crop.url);
            crop = null;
            const el = document.getElementById('cropper');
            el.classList.add('hidden');
            el.classList.remove('flex');
        }
        function cropCancel() { closeCropper(); }
        function cropConfirm() {
            if (!crop) return;
            const out = 320;                                   // 輸出 320px，比之前清晰
            const c = document.createElement('canvas');
            c.width = out; c.height = out;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, out, out);
            const sc = crop.scale;
            ctx.drawImage(crop.img, -crop.x / sc, -crop.y / sc, crop.V / sc, crop.V / sc, 0, 0, out, out);
            const dataUrl = c.toDataURL('image/jpeg', 0.88);
            const target = crop.target;
            closeCropper();
            if (target === '__draft') { if (draft) draft.photo = dataUrl; }
            else { const pp = P(target); if (pp) pp.photo = dataUrl; }
            renderAll();
            renderSheet();
        }

        // ---------- 拖拉合成組別 (長按再拖；滑鼠可直接拖) ----------
        let dg = null;
        function onTileDown(e) {
            const el = e.target.closest('[data-unit]');
            if (!el || dg) return;
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            dg = { gid: el.dataset.unit, el: el, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY,
                   active: false, pt: e.pointerType, pid: e.pointerId, t0: Date.now(), target: null, ghost: null, raf: 0, timer: 0 };
            if (e.pointerType !== 'mouse') dg.timer = setTimeout(startDrag, 350);
            window.addEventListener('pointermove', onDragMove);
            window.addEventListener('pointerup', onDragUp);
            window.addEventListener('pointercancel', onDragCancel);
        }
        function startDrag() {
            if (!dg) return;
            dg.active = true;
            dg.el.classList.add('dragging-src');
            const g = dg.el.cloneNode(true);
            g.removeAttribute('data-unit');
            g.id = 'drag-ghost';
            g.style.width = dg.el.offsetWidth + 'px';
            document.body.appendChild(g);
            dg.ghost = g;
            moveGhost();
            dragLoop();
        }
        function moveGhost() {
            const g = dg.ghost;
            g.style.left = (dg.x - g.offsetWidth / 2) + 'px';
            g.style.top = (dg.y - g.offsetHeight / 2) + 'px';
        }
        function dragLoop() {
            if (!dg || !dg.active) return;
            const margin = 90;
            if (dg.y < margin) window.scrollBy(0, -14);
            else if (dg.y > window.innerHeight - margin) window.scrollBy(0, 14);
            updateTarget();
            dg.raf = requestAnimationFrame(dragLoop);
        }
        function updateTarget() {
            const under = document.elementFromPoint(dg.x, dg.y);
            let t = under ? under.closest('[data-unit]') : null;
            if (t && t === dg.el) t = null;
            if (t !== dg.target) {
                if (dg.target) dg.target.classList.remove('drop-target');
                if (t) t.classList.add('drop-target');
                dg.target = t;
            }
        }
        function onDragMove(e) {
            if (!dg || e.pointerId !== dg.pid) return;
            dg.x = e.clientX; dg.y = e.clientY;
            const dist = Math.hypot(dg.x - dg.sx, dg.y - dg.sy);
            if (!dg.active) {
                if (dg.pt === 'mouse') { if (dist > 6) startDrag(); }
                else if (dist > 10) endDrag();   // 未長按已經郁，當作捲動
                return;
            }
            moveGhost();
            updateTarget();
        }
        function onDragUp(e) {
            if (!dg || e.pointerId !== dg.pid) return;
            dg.x = e.clientX; dg.y = e.clientY;
            if (dg.active) updateTarget();
            const dist = Math.hypot(dg.x - dg.sx, dg.y - dg.sy);
            const gid = dg.gid, target = dg.target ? dg.target.dataset.unit : null;
            const wasActive = dg.active;
            endDrag();
            if (wasActive && target) mergeUnits(gid, target);
            else if (dist < 10) openUnit(gid);   // 輕撳 / 長按唔郁 = 開細節
        }
        function onDragCancel() { endDrag(); }
        function endDrag() {
            if (!dg) return;
            clearTimeout(dg.timer);
            cancelAnimationFrame(dg.raf);
            if (dg.ghost) dg.ghost.remove();
            dg.el.classList.remove('dragging-src');
            if (dg.target) dg.target.classList.remove('drop-target');
            window.removeEventListener('pointermove', onDragMove);
            window.removeEventListener('pointerup', onDragUp);
            window.removeEventListener('pointercancel', onDragCancel);
            dg = null;
        }
        // 拖動期間禁止頁面捲動
        document.addEventListener('touchmove', function (e) { if (dg && dg.active) e.preventDefault(); }, { passive: false });
        (function () {
            const c = document.getElementById('people-container');
            c.addEventListener('pointerdown', onTileDown);
            c.addEventListener('contextmenu', e => e.preventDefault());
        })();

        // ---------- 齋食飯名單 ----------
        function renderPure() {
            const c = document.getElementById('pure-dinners-container');
            const items = S.pureDinners.map(id => P(id)).filter(Boolean);
            if (items.length === 0) {
                c.innerHTML = '<span class="text-xs text-slate-400">未有齋食飯人員，撳右上角嘅 ＋ 由人員名單加入。</span>';
            } else {
                c.innerHTML = items.map(p => `
                    <span class="inline-flex items-center gap-1.5 bg-slate-100 rounded-full pl-1 pr-2 py-1 text-sm">
                        ${avatarHtml(p, 'xs')}<span>${esc(nameOf(p))}</span>
                        <button onclick="removePure('${p.id}')" class="text-slate-400 hover:text-red-500 font-bold">×</button>
                    </span>`).join('');
            }
            document.getElementById('dinner-mode').value = S.dinnerMode;
        }
        function openPureDinnerPicker() {
            openPicker({
                title: '齋食飯名單：點選要加入嘅人', hint: '再點一下可以取消。已入座嘅人唔可以列入齋食飯名單。', multi: true,
                selected: S.pureDinners,

                onDone: ids => { S.pureDinners = ids; renderPure(); calculate(); }

        function changeDinnerMode(v) { S.dinnerMode = v; calculate(); }

        // ---------- 數字輸入檢查 ----------
        // 只准數字同最多一個小數點；唔可以 0 開頭 (例如 007 → 7)；allowNeg 先准開頭有一個負號
        function sanitizeNum(raw, allowNeg) {
            let t = String(raw)
                .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
                .replace(/[．。]/g, '.').replace(/[－−]/g, '-');
            const neg = allowNeg && t.trim().charAt(0) === '-';
            t = t.replace(/[^0-9.]/g, '');
            const dot = t.indexOf('.');
            let intp = dot >= 0 ? t.slice(0, dot) : t;
            const dec = dot >= 0 ? t.slice(dot + 1).replace(/\./g, '') : null;
            intp = intp.replace(/^0+(?=\d)/, '');
            if (intp === '' && dec !== null) intp = '0';
            return (neg ? '-' : '') + intp + (dec !== null ? '.' + dec : '');
        }
        function numInput(el, allowNeg) {
            const clean = sanitizeNum(el.value, allowNeg);
            if (clean !== el.value) {
                el.value = clean;
                try { el.setSelectionRange(clean.length, clean.length); } catch (e) { /* ignore */ }
            }
        }
        // 贏輸輸入框用 type=number (iPhone 先有負號鍵)：擋住 e / + / 多過一個小數點同負號，去走 0 開頭
        function numGuard(e) {
            const d = e.data;
            if (!d) return;
            const el = e.target;
            for (const ch of d) {
                if (!/[0-9.\-]/.test(ch) ||
                    (ch === '.' && el.value.includes('.')) ||
                    (ch === '-' && el.value.includes('-'))) { e.preventDefault(); return; }
            }
        }
        function numInputSigned(el) {
            const v = el.value;                      // 未成數字嘅輸入 (例如淨係 "-") 會係 ''
            if (v === '') return;
            const clean = sanitizeNum(v, true);
            if (clean !== v) el.value = clean;
        }
        // 撳入輸入框就全選，直接打新數字會取代舊數字 (打負數先唔會變成 "0-")
        function selectAll(el) { setTimeout(() => { try { el.select(); } catch (e) { /* ignore */ } }, 0); }
        function numBlur(el) {
            if (el.validity && el.validity.badInput) { el.value = ''; el.dispatchEvent(new Event('input', { bubbles: true })); }
        }

        // ---------- 麻雀台 ----------
        function renderTables() {

                c.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">未有麻雀台，撳右上角嘅 ＋ 新增麻雀台，由人員名單點選入座。</p>';

                            <button onclick="removeTable(${ti})" class="text-red-500 hover:text-red-700 text-xs font-medium ml-2">刪除此台</button>

        }
        function addTable() {
            openPicker({
                title: '新增麻雀台：點選入座人員', hint: '一定要揀齊 4 位，按你點選嘅次序入座。', multi: true, exact: 4,

        let confirmCb = null;
        function openConfirm(title, msg, onOk) {
            confirmCb = onOk;
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;

        function removeTable(ti) {
            openConfirm(`刪除第 ${ti + 1} 台？`, '此台所有座位同贏輸記錄都會刪除，刪除後無法還原。', () => {

        }
        function updateTableCommission(ti, v) { S.tables[ti].commission = parseFloat(v) || 0; calculate(); }
        function updateSeatWl(ti, si, v) { S.tables[ti].seats[si].wl = parseFloat(v) || 0; calculate(); }
        function removeSeat(ti, si) { S.tables[ti].seats.splice(si, 1); renderTables(); calculate(); }
        function changeSeat(ti, si) {
            openPicker({
                title: '更正此座位人選', hint: '只係改人，贏輸數字保持不變。', multi: false,
                onDone: ids => { S.tables[ti].seats[si].personId = ids[0]; renderTables(); calculate(); }
            });
        }
        function swapSeat(ti, si) {
            openPicker({
                title: '中途換人：揀接替嘅人', hint: '原本座位嘅贏輸保留，新增一個接替時段。', multi: false,
                onDone: ids => { S.tables[ti].seats.splice(si + 1, 0, seat(ids[0], 0, true)); renderTables(); calculate(); }
            });
        }
        // ---------- 計算 (邏輯同原本一樣，只係改用人員 ID) ----------
        function compute() {
            const errors = [];
            const tableErrors = {};     // 每台自己嘅錯誤，顯示喺該台方格底部
            let totalDinner = 0;
            S.paidDinners.forEach(r => { totalDinner += r.amount; });

            // 已入座嘅人唔可以列入齋食飯名單
            S.pureDinners.forEach(id => {
                const pp = P(id), t = tablesOf(id);
                if (pp && t.length) errors.push(`「${nameOf(pp)}」已入座第 ${t.join('、')} 台，唔可以同時列入齋食飯名單，請喺齋食飯名單移走佢。`);
            });

            let totalCommission = 0;
            const pm = new Map(); // personId -> { wl, paid, isPlaying }

            S.tables.forEach((table, ti) => {
                let tableWlSum = 0;
                table.seats.forEach(s => {
                    const p = P(s.personId);
                    if (!named(p)) return;
                    tableWlSum += s.wl;
                    if (!pm.has(p.id)) pm.set(p.id, { wl: 0, paid: 0, isPlaying: true });
                    const e = pm.get(p.id);
                    e.wl += s.wl;
                    e.isPlaying = true;
                });
                totalCommission += table.commission;
                const tableCheck = tableWlSum + table.commission;
                if (Math.abs(tableCheck) > 0.01) {
                    const r2 = v => Number(v.toFixed(2));
                    tableErrors[ti] = `第 ${ti + 1} 台數目唔對路！玩家贏輸總和 (${r2(tableWlSum)}) + 抽水 (${r2(table.commission)}) = ${r2(tableCheck)} (必須剛好等於 0)`;
                }
            });

            S.paidDinners.forEach(r => {
                const p = P(r.personId);
                if (!named(p)) return;
                if (!pm.has(p.id)) pm.set(p.id, { wl: 0, paid: 0, isPlaying: false });
                pm.get(p.id).paid += r.amount;
            });

            const pureIds = S.pureDinners.filter(id => named(P(id)));
            pureIds.forEach(id => {
                if (!pm.has(id)) pm.set(id, { wl: 0, paid: 0, isPlaying: false });
            });

            const balanceDiff = totalDinner - totalCommission;
            const allIds = Array.from(pm.keys());
            const count = allIds.length;
            const finalShares = {};

            if (balanceDiff > 0) {
                if (S.dinnerMode === 'subsidy') {
                    const sharePerPerson = count > 0 ? balanceDiff / count : 0;
                    allIds.forEach(id => { finalShares[id] = sharePerPerson; });
                } else {
                    const pureShare = count > 0 ? totalDinner / count : 0;
                    const playingIds = allIds.filter(id => pm.get(id).isPlaying);
                    const nonPlayingIds = pureIds.filter(id => !pm.get(id).isPlaying);
                    nonPlayingIds.forEach(id => { finalShares[id] = pureShare; });
                    const remainingForPlayers = totalDinner - (pureShare * nonPlayingIds.length) - totalCommission;
                    const playerShare = playingIds.length > 0 ? remainingForPlayers / playingIds.length : 0;
                    playingIds.forEach(id => { finalShares[id] = playerShare; });
                    allIds.forEach(id => {
                        if (pm.get(id).isPlaying) finalShares[id] = playerShare;
                        else if (!finalShares[id]) finalShares[id] = pureShare;
                    });
                }
            } else {
                const extraMoney = -balanceDiff;
                const playingIds = allIds.filter(id => pm.get(id).isPlaying);
                const extraPerPlayer = playingIds.length > 0 ? extraMoney / playingIds.length : 0;
                allIds.forEach(id => { finalShares[id] = 0; });
                playingIds.forEach(id => { finalShares[id] = -extraPerPlayer; });
            }

            const results = new Map();
            allIds.forEach(id => {
                const e = pm.get(id);
                const share = finalShares[id] || 0;
                results.set(id, { wl: e.wl, share: share, paid: e.paid, net: e.wl - share + e.paid });
            });

            return { errors, tableErrors, totalDinner, totalCommission, balanceDiff, results };
        }

        function calculate() {
            const c = compute();
            const gm = groupsMap();
            refreshStats();

            document.getElementById('total-dinner-display').innerText = `$${c.totalDinner.toFixed(2)}`;

            const errBox = document.getElementById('error-container');
            if (c.errors.length > 0) {
                errBox.classList.remove('hidden');
                document.getElementById('error-message').innerHTML = c.errors.map(esc).join('<br>');
            } else {
                errBox.classList.add('hidden');
            }
            S.tables.forEach((t, ti) => {
                const el = document.getElementById('table-err-' + ti);
                if (!el) return;
                const m = c.tableErrors[ti];
                if (m) { el.textContent = m; el.classList.remove('hidden'); }
                else { el.textContent = ''; el.classList.add('hidden'); }
            });

            document.getElementById('res-total-commission').innerText = `$${c.totalCommission.toFixed(2)}`;
            document.getElementById('res-total-dinner').innerText = `$${c.totalDinner.toFixed(2)}`;
            document.getElementById('res-balance-diff').innerText = `$${c.balanceDiff.toFixed(2)} ${c.balanceDiff > 0 ? '(需額外分擔)' : '(抽水有突)'}`;

            // 個人明細
            let rows = '';
            c.results.forEach((r, id) => {
                const p = P(id);
                const members = gm.get(p.groupId) || [];
                const tag = members.length > 1 ? `<span class="block text-xs font-normal text-indigo-600">${esc(groupName(p.groupId, gm))} 組</span>` : '';
                rows += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-medium text-slate-800"><span class="inline-flex items-center gap-2">${avatarHtml(p, 'sm')}<span class="leading-tight"><span class="block">${esc(nameOf(p))}</span>${tag}</span></span></td>
                        <td class="p-3 ${r.wl > 0 ? 'text-emerald-600 font-semibold' : r.wl < 0 ? 'text-rose-600 font-semibold' : 'text-slate-500'}">${r.wl > 0 ? '+' : ''}${r.wl.toFixed(2)}</td>
                        <td class="p-3 text-slate-600">-${r.share.toFixed(2)}</td>
                        <td class="p-3 text-indigo-600 font-medium">+${r.paid.toFixed(2)}</td>
                        <td class="p-3 text-right font-bold ${r.net > 0 ? 'text-emerald-600' : r.net < 0 ? 'text-rose-600' : 'text-slate-500'}">${r.net > 0 ? '+' : ''}${r.net.toFixed(2)}</td>
                    </tr>`;
            });
            document.getElementById('summary-table-body').innerHTML = rows;

            // 以組別加總
            const groups = new Map(); // gid -> { net, members:[person] }
            c.results.forEach((r, id) => {
                const p = P(id);
                if (!groups.has(p.groupId)) groups.set(p.groupId, { net: 0, members: [] });
                const g = groups.get(p.groupId);
                g.net += r.net;
                g.members.push(p);
            });

            let gHtml = '';
            const debtors = [], creditors = [];
            groups.forEach((g, gid) => {
                const all = captainFirst(gm.get(gid) || g.members);
                const capId = captainOf(all).id;
                const label = groupName(gid, gm);
                const multi = all.length > 1;
                const av = unitAvatar(all, 'sm');
                const chips = multi ? `<span class="flex flex-col gap-1.5 mt-1.5">${all.map(m => `<span class="flex items-center gap-2 text-xs text-slate-500 whitespace-nowrap">${avatarHtml(m, 'xs')}${m.id === capId ? '👑' : ''}${esc(nameOf(m))}<span class="${locationOf(m) === '未入座' ? 'text-amber-600' : 'text-slate-400'}">· ${esc(locationOf(m))}</span></span>`).join('')}</span>` : '';
                gHtml += `
                    <div class="flex items-start justify-between gap-2 bg-white/70 rounded-xl px-3 py-2">
                        <span class="flex items-start gap-2 min-w-0">${av}
                            <span class="min-w-0"><span class="font-semibold text-slate-800">${esc(label)}${multi ? ' 組' : ''}</span>${chips}</span></span>
                        <span class="font-bold shrink-0 ${g.net > 0.01 ? 'text-emerald-600' : g.net < -0.01 ? 'text-rose-600' : 'text-slate-500'}">${g.net > 0 ? '+' : ''}${g.net.toFixed(2)}</span>
                    </div>`;
                const entry = { gid: gid, name: label + (multi ? ' 組' : ''), av: av };
                if (g.net < -0.01) debtors.push(Object.assign({ amount: -g.net }, entry));
                if (g.net > 0.01) creditors.push(Object.assign({ amount: g.net }, entry));
            });
            document.getElementById('group-balances').innerHTML = gHtml || '<p class="text-slate-500 italic">未有結算資料。</p>';

            // 找數路徑 (組別之間)
            const txs = [];
            let d = 0, k = 0;
            while (d < debtors.length && k < creditors.length) {
                const amt = Math.min(debtors[d].amount, creditors[k].amount);
                txs.push({ from: debtors[d], to: creditors[k], amount: amt });
                debtors[d].amount -= amt;
                creditors[k].amount -= amt;
                if (debtors[d].amount < 0.01) d++;
                if (creditors[k].amount < 0.01) k++;
            }
            const txList = document.getElementById('transactions-list');
            if (txs.length === 0) {
                txList.innerHTML = '<li class="text-slate-500 italic">目前所有人結算平衡，無需轉賬。</li>';
            } else {
                txList.innerHTML = txs.map(t => `
                    <li class="leading-relaxed"><span class="font-semibold text-slate-800 whitespace-nowrap">${esc(t.from.name)}</span> 付 <span class="font-semibold text-emerald-600">$${t.amount.toFixed(2)}</span> 給 👉 <span class="font-semibold text-slate-800 whitespace-nowrap">${esc(t.to.name)}</span></li>`).join('');
            }

            // 供複製報告同測試用 (以名稱為 key)
            const byName = {};
            c.results.forEach((r, id) => { byName[nameOf(P(id))] = r; });
            window.currentResults = byName;
            window.currentTransactions = txs.map(t => ({ from: t.from.name, to: t.to.name, amount: t.amount }));
            window.lastCalc = {
                c: c,
                txs: window.currentTransactions,
                groups: Array.from(groups.entries()).map(([gid, g]) => {
                    const all = captainFirst(gm.get(gid) || g.members);
                    return { label: groupName(gid, gm), members: all, capId: captainOf(all).id, net: g.net };
                })
            };

            save();
        }

        function copyReport() {
            let text = '🀄 麻雀與食飯結算報告\n\n';
            const results = window.currentResults || {};
            for (const name in results) {
                const r = results[name];
                text += `${name}: ${r.net >= 0 ? '+' : ''}${r.net.toFixed(2)}\n`;
            }
            const txs = window.currentTransactions || [];
            text += '\n💸 建議找數方式\n';
            if (txs.length === 0) text += '目前所有人結算平衡，無需轉賬。\n';
            txs.forEach(t => { text += `${t.from} 付 $${t.amount.toFixed(2)} 給 ${t.to}\n`; });
            navigator.clipboard.writeText(text).then(() => {
                alert('已成功複製結算報告到剪貼簿！');
            });
        }

        // ---------- 匯出完整結算報告 (獨立 HTML 檔) ----------
        const RPT_COLORS = ['#fef3c7|#b45309', '#ede9fe|#6d28d9', '#fce7f3|#be185d', '#d1fae5|#047857', '#e0f2fe|#0369a1', '#ccfbf1|#0f766e', '#ffedd5|#c2410c', '#f1f5f9|#475569'];
        function rptAv(p, px) {
            const st = `width:${px}px;height:${px}px;border-radius:50%;flex:none;`;
            if (!p) return `<span class="av" style="${st}background:#e2e8f0;color:#64748b">?</span>`;
            if (p.photo) return `<img src="${p.photo}" alt="" style="${st}object-fit:cover">`;
            const [bg, fg] = RPT_COLORS[(parseInt(p.id.slice(1), 10) || 0) % RPT_COLORS.length].split('|');
            const initial = named(p) ? Array.from(p.name.trim())[0] : '👤';
            return `<span class="av" style="${st}background:${bg};color:${fg};font-size:${Math.round(px * 0.42)}px">${esc(initial)}</span>`;
        }
        function money(v, plus) { return (plus && v > 0 ? '+' : '') + v.toFixed(2); }
        function cls(v) { return v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : 'zero'; }

        function buildReportHtml() {
            const L = window.lastCalc || { c: compute(), txs: [], groups: [] };
            const c = L.c;
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${pad(now.getHours())}:${pad(now.getMinutes())}`;
            const gm = groupsMap();

            // 人數設定 (按組別)
            const peopleHtml = Array.from(gm.entries()).map(([gid, arr]) => {
                const all = captainFirst(arr.filter(named));
                if (!all.length) return '';
                const multi = all.length > 1;
                return `<div class="unit"><div class="unit-top">${rptAv(all[0], 64)}</div>
                    <div class="unit-name">${esc(groupName(gid, gm))}${multi ? ' 組' : ''}</div>
                    ${multi ? all.map((m, i) => `<div class="mem">${rptAv(m, 24)}<span>${i === 0 ? '👑' : ''}${esc(nameOf(m))}</span></div>`).join('') : ''}
                    <div class="loc">${esc(locationOf(all[0]))}</div></div>`;
            }).join('');

            const pureHtml = S.pureDinners.map(P).filter(named).map(p => `<span class="chip">${rptAv(p, 28)}${esc(nameOf(p))}</span>`).join('') || '<span class="muted">（無）</span>';
            const paidHtml = S.paidDinners.filter(r => named(P(r.personId))).map(r => `<div class="row"><span class="chip">${rptAv(P(r.personId), 28)}${esc(nameOf(P(r.personId)))}</span><b>$${r.amount.toFixed(2)}</b></div>`).join('') || '<span class="muted">（無記錄）</span>';
            const modeLabel = S.dinnerMode === 'subsidy' ? '參與抽水補貼' : '無抽水補貼（純計飯錢）';

            const tablesHtml = S.tables.map((t, ti) => `
                <div class="card inner"><div class="row"><h3>第 ${ti + 1} 台</h3><span class="muted">抽水：$${(+t.commission).toFixed(2)}</span></div>
                ${t.seats.map(s => { const p = P(s.personId); return `<div class="seat ${s.sub ? 'sub' : ''}">${rptAv(p, 40)}<span class="grow">${esc(nameOf(p))}${s.sub ? ' <span class="muted">(換人時段)</span>' : ''}</span><b class="${cls(s.wl)}">${money(s.wl, true)}</b></div>`; }).join('')}
                ${c.tableErrors[ti] ? `<div class="err">${esc(c.tableErrors[ti])}</div>` : ''}</div>`).join('') || '<span class="muted">（未有麻雀台）</span>';

            let rows = '';
            c.results.forEach((r, id) => {
                const p = P(id), members = gm.get(p.groupId) || [];
                const tag = members.length > 1 ? `<div class="tag">${esc(groupName(p.groupId, gm))} 組</div>` : '';
                rows += `<tr><td><span class="nm">${rptAv(p, 36)}<span><div>${esc(nameOf(p))}</div>${tag}</span></span></td>
                    <td class="${cls(r.wl)}">${money(r.wl, true)}</td><td>-${r.share.toFixed(2)}</td><td class="ind">+${r.paid.toFixed(2)}</td>
                    <td class="r ${cls(r.net)}"><b>${money(r.net, true)}</b></td></tr>`;
            });

            const groupsHtml = L.groups.map(g => {
                const multi = g.members.length > 1;
                return `<div class="row top"><span class="nm">${rptAv(g.members[0], 40)}<span><b>${esc(g.label)}${multi ? ' 組' : ''}</b>${multi ? g.members.map(m => `<div class="mem small">${rptAv(m, 20)}<span>${m.id === g.capId ? '👑' : ''}${esc(nameOf(m))} · ${esc(locationOf(m))}</span></div>`).join('') : ''}</span></span><b class="${cls(g.net)}">${money(g.net, true)}</b></div>`;
            }).join('') || '<span class="muted">未有結算資料。</span>';
            const txHtml = L.txs.length ? L.txs.map(t => `<li><b>${esc(t.from)}</b> 付 <b class="pos">$${t.amount.toFixed(2)}</b> 給 👉 <b>${esc(t.to)}</b></li>`).join('') : '<li class="muted">目前所有人結算平衡，無需轉賬。</li>';

            const css = `*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-top:16px}.inner{background:#f8fafc;margin-top:12px;padding:12px}
h1{text-align:center;font-size:22px;margin:0}h1+p{text-align:center;color:#64748b;margin:4px 0 0;font-size:13px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0}
.muted{color:#94a3b8;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}.row.top{align-items:flex-start}.grow{flex:1}
.av{display:inline-flex;align-items:center;justify-content:center;font-weight:600}.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border-radius:999px;padding:3px 10px 3px 3px;margin:2px;font-size:14px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.unit{text-align:center;padding:8px;border:1px solid #e2e8f0;border-radius:12px}.unit-top{display:flex;justify-content:center}.unit-name{font-size:14px;font-weight:600;margin-top:4px}.loc{font-size:11px;color:#94a3b8}
.mem{display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b;margin-top:4px}.mem.small{font-size:11px}.nm{display:inline-flex;align-items:center;gap:8px}.tag{font-size:11px;color:#4f46e5;font-weight:400}
.seat{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:6px 10px;margin-top:6px}.seat.sub{margin-left:16px;border-left:2px solid #c7d2fe}
.pos{color:#059669}.neg{color:#e11d48}.zero{color:#64748b}.ind{color:#4f46e5}.err{background:#fef2f2;border-left:4px solid #ef4444;color:#b91c1c;font-size:13px;padding:8px;border-radius:8px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px}.stat small{display:block;color:#64748b;font-size:11px}.stat b{font-size:17px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{background:#f1f5f9;color:#475569;font-size:12px;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid #f1f5f9}th.r,td.r{text-align:right}
.pay{background:#eef2ff;border-color:#c7d2fe}ul{padding:0;list-style:none;margin:12px 0 0;border-top:1px solid #c7d2fe;padding-top:10px}li{margin:8px 0}footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}`;

            return `<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻雀與食飯結算報告 ${dateStr}</title><style>${css}</style></head><body><div class="wrap">
<h1>🀄 麻雀與食飯抽水結算報告</h1><p>報告日期：${dateStr}</p>
<div class="card"><h2>🐷 人數設定</h2><p class="muted">麻雀枱 ${S.tables.length} 台 · 齋食飯 ${S.pureDinners.length} 人 · 總人數 ${S.people.filter(named).length} 人</p><div class="units">${peopleHtml}</div></div>
<div class="card"><h2>🍲 齋食飯名單</h2><div>${pureHtml}</div><p class="muted">飯錢計算方法：${esc(modeLabel)}</p></div>
<div class="card"><h2>💰 已付食飯錢記錄</h2>${paidHtml}<div class="row" style="border-top:1px solid #e2e8f0;padding-top:8px"><span class="muted">食飯錢總額</span><b>$${c.totalDinner.toFixed(2)}</b></div></div>
<div class="card"><h2>🀄 麻雀台資料</h2>${tablesHtml}</div>
<div class="card"><h2>📊 最終結算報告</h2>
<div class="stats"><div class="stat"><small>總抽水金額</small><b>$${c.totalCommission.toFixed(2)}</b></div><div class="stat"><small>總食飯支出</small><b>$${c.totalDinner.toFixed(2)}</b></div><div class="stat"><small>抽水扣除後差額</small><b>$${c.balanceDiff.toFixed(2)}</b><small>${c.balanceDiff > 0 ? '(需額外分擔)' : '(抽水有突)'}</small></div></div>
${c.errors.length ? `<div class="err">${c.errors.map(esc).join('<br>')}</div>` : ''}
<div class="scroll" style="margin-top:14px"><table><thead><tr><th>名字</th><th>贏輸</th><th>飯錢分擔</th><th>已付飯錢</th><th class="r">最終結果 (收/付)</th></tr></thead><tbody>${rows}</tbody></table></div></div>
<div class="card pay"><h2>💸 建議找數方式</h2>${groupsHtml}<ul>${txHtml}</ul></div>
<footer>由「麻雀與食飯抽水結算系統」產生</footer></div></body></html>`;
        }

        async function shareReportHtml() {
            calculate();
            const now = new Date(), pad = n => String(n).padStart(2, '0');
            const name = `麻雀結算報告_${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.html`;
            const blob = new Blob([buildReportHtml()], { type: 'text/html' });
            const file = new File([blob], name, { type: 'text/html' });
            try {
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: '麻雀結算報告' });
                    return;
                }
            } catch (e) { if (e && e.name === 'AbortError') return; /* 其他錯誤就改用下載 */ }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        }

        // ---------- 資料管理 ----------
        function loadSample() {
            if (!confirm('還原成範例資料？目前所有人員、相片同記錄會被取代。')) return;
            sampleState();
            renderAll();
        }
        function clearAll() {
            if (!confirm('清空全部資料？所有人員、相片同記錄都會刪除，無法還原。')) return;
            S = emptyState();
            renderAll();
        }

        function renderAll() {
            renderPeople();
            renderPure();
            renderPaid();
            renderTables();
            calculate();
        }

        window.onload = function () {
            load();
            renderAll();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀耍樂與食飯費用結算系統 (支援中途換人)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- 標題 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
            <h1 class="text-2xl font-bold text-slate-900">🀄 麻雀耍樂與食飯費用結算系統</h1>
            <p class="text-sm text-slate-500 mt-1">支援中途換人/分段結算、每台零和校驗、自動飯費及找數路徑</p>
        </div>

        <!-- 錯誤警告容器 -->
        <div id="error-container" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-xl shadow-sm">
            <div class="flex">
                <div class="flex-shrink-0 text-red-500 font-bold">⚠️ 注意：</div>
                <div class="ml-3 text-sm text-red-700 font-medium" id="error-message"></div>
            </div>
        </div>

        <!-- 設定區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 淨係食飯設定 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-semibold text-slate-800 mb-3">🍲 淨係食飯成員設定</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">淨係食飯人員名單 (用逗號隔開)</label>
                        <input type="text" id="pure-dinners" value="Homan" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" oninput="calculate()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">淨係食飯者之飯錢計算方式</label>
                        <select id="dinner-mode" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" onchange="calculate()">
                            <option value="subsidy">參與抽水補貼 (平分剩餘差額)</option>
                            <option value="pure">純粹計算實際均分飯錢 (不參與抽水補貼)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 已出食飯錢設定 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-slate-800">💰 已付食飯錢記錄</h2>
                    <button onclick="addPaidDinnerRow()" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl font-medium hover:bg-indigo-100">+ 新增記錄</button>
                </div>
                <div id="paid-dinners-container" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <!-- 動態加入 -->
                </div>
                <div class="mt-3 pt-2 border-t flex justify-between items-center text-sm font-semibold">
                    <span class="text-slate-500">自動加總食飯錢總額：</span>
                    <span id="total-dinner-display" class="text-indigo-600 text-base">$0</span>
                </div>
            </div>
        </div>

        <!-- 麻雀台數管理 (支援中途換人) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-lg font-semibold text-slate-800">🀄 麻雀台資料 (含中途換人/分段)</h2>
                    <p class="text-xs text-slate-500 mt-0.5">如果有人中途換人，可以直接新增該座位嘅不同打牌時段與贏輸</p>
                </div>
                <button onclick="addTable()" class="bg-indigo-600 text-white text-xs px-4 py-2 rounded-xl font-medium hover:bg-indigo-700 shadow-sm">+ 新增麻雀台</button>
            </div>
            <div id="tables-container" class="space-y-6">
                <!-- 動態麻雀台 -->
            </div>
        </div>

        <!-- 結算結果 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
            <h2 class="text-lg font-semibold text-slate-800 border-b pb-2">📊 最終結算報告</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                <div class="bg-slate-50 p-4 rounded-xl border">
                    <div class="text-xs text-slate-500">總抽水金額</div>
                    <div id="res-total-commission" class="text-xl font-bold text-slate-800 mt-1">$0</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border">
                    <div class="text-xs text-slate-500">總食飯支出</div>
                    <div id="res-total-dinner" class="text-xl font-bold text-slate-800 mt-1">$0</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border">
                    <div class="text-xs text-slate-500">抽水扣除後差額</div>
                    <div id="res-balance-diff" class="text-xl font-bold text-slate-800 mt-1">$0</div>
                </div>
            </div>

            <!-- 個人明細表格 -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase">
                            <th class="p-3 rounded-l-xl">名字</th>
                            <th class="p-3">贏輸狀態 (累計)</th>
                            <th class="p-3">飯錢分擔</th>
                            <th class="p-3">已付飯錢</th>
                            <th class="p-3 rounded-r-xl text-right">最終結果 (收/付)</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body" class="divide-y divide-slate-100">
                        <!-- 動態插入 -->
                    </tbody>
                </table>
            </div>

            <!-- 找數路徑 -->
            <div class="bg-indigo-50/50 p-5 rounded-2xl border border-indigo-100 space-y-3">
                <h3 class="font-semibold text-indigo-900">💸 建議找數路徑 (誰付給誰)</h3>
                <ul id="transactions-list" class="space-y-2 text-sm text-slate-700">
                    <!-- 動態插入 -->
                </ul>
            </div>

            <!-- 複製按鈕 -->
            <button onclick="copyReport()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-medium hover:bg-slate-800 transition shadow-sm">
                📋 一鍵複製結算報告分享
            </button>
        </div>

    </div>

    <script>
        // 初始化預設數據
        let paidDinnersData = [
            { name: "Sam", amount: 41 },
            { name: "Ada", amount: 5 }
        ];

        let tablesData = [
            {
                id: 1,
                commission: 11.5,
                players: [
                    { name: "Sam", wl: -2.5 },
                    { name: "Eddie", wl: 0 },
                    { name: "Garry", wl: -20 },
                    { name: "Janet", wl: 11 }
                ]
            },
            {
                id: 2,
                commission: 12.5,
                players: [
                    { name: "Ada", wl: -10.5 },
                    { name: "Agnes", wl: -14.5 },
                    { name: "Michelle", wl: -0.5 },
                    { name: "Venus", wl: 13 }
                ]
            }
        ];

        window.onload = function() {
            renderPaidDinners();
            renderTables();
            calculate();
        };

        function renderPaidDinners() {
            const container = document.getElementById('paid-dinners-container');
            container.innerHTML = '';
            paidDinnersData.forEach((item, index) => {
                container.innerHTML += `
                    <div class="flex items-center space-x-2">
                        <input type="text" value="${item.name}" placeholder="姓名" class="w-1/2 px-3 py-1.5 border rounded-xl text-sm" oninput="updatePaidDinner(${index}, 'name', this.value)">
                        <input type="number" value="${item.amount}" placeholder="金額" class="w-1/3 px-3 py-1.5 border rounded-xl text-sm" oninput="updatePaidDinner(${index}, 'amount', this.value)">
                        <button onclick="removePaidDinner(${index})" class="text-red-500 hover:text-red-700 px-2 font-bold">×</button>
                    </div>
                `;
            });
        }

        function addPaidDinnerRow() {
            paidDinnersData.push({ name: "", amount: 0 });
            renderPaidDinners();
            calculate();
        }

        function updatePaidDinner(index, field, value) {
            paidDinnersData[index][field] = field === 'amount' ? parseFloat(value) || 0 : value;
            calculate();
        }

        function removePaidDinner(index) {
            paidDinnersData.splice(index, 1);
            renderPaidDinners();
            calculate();
        }

        function renderTables() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';
            tablesData.forEach((table, tIndex) => {
                let playersHtml = '';
                table.players.forEach((p, pIndex) => {
                    playersHtml += `
                        <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl">
                            <input type="text" value="${p.name}" placeholder="玩家名字 (可換人)" class="w-3/5 px-2.5 py-1 border rounded-lg text-sm bg-white" oninput="updatePlayer(${tIndex}, ${pIndex}, 'name', this.value)">
                            <input type="number" value="${p.wl}" placeholder="贏輸" class="w-2/5 px-2.5 py-1 border rounded-lg text-sm bg-white" oninput="updatePlayer(${tIndex}, ${pIndex}, 'wl', this.value)">
                            <button onclick="removePlayer(${tIndex}, ${pIndex})" class="text-red-400 hover:text-red-600 font-bold px-1" title="刪除此時段/玩家">×</button>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="border border-slate-200 p-4 rounded-xl space-y-3 bg-white">
                        <div class="flex justify-between items-center">
                            <h3 class="font-semibold text-slate-700 text-sm">第 ${tIndex + 1} 台</h3>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-500">抽水：</span>
                                <input type="number" value="${table.commission}" class="w-24 px-2 py-1 border rounded-lg text-sm" oninput="updateTableCommission(${tIndex}, this.value)">
                                <button onclick="removeTable(${tIndex})" class="text-red-500 hover:text-red-700 text-xs font-medium ml-2">刪除此台</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                            ${playersHtml}
                        </div>
                        <button onclick="addPlayer(${tIndex})" class="text-xs text-indigo-600 font-medium hover:underline">+ 新增打牌時段/換人記錄</button>
                    </div>
                `;
            });
        }

        function addTable() {
            tablesData.push({ id: tablesData.length + 1, commission: 0, players: [{ name: "", wl: 0 }] });
            renderTables();
            calculate();
        }

        function removeTable(tIndex) {
            tablesData.splice(tIndex, 1);
            renderTables();
            calculate();
        }

        function updateTableCommission(tIndex, val) {
            tablesData[tIndex].commission = parseFloat(val) || 0;
            calculate();
        }

        function addPlayer(tIndex) {
            tablesData[tIndex].players.push({ name: "", wl: 0 });
            renderTables();
            calculate();
        }

        function removePlayer(tIndex, pIndex) {
            tablesData[tIndex].players.splice(pIndex, 1);
            renderTables();
            calculate();
        }

        function updatePlayer(tIndex, pIndex, field, val) {
            tablesData[tIndex].players[pIndex][field] = field === 'wl' ? parseFloat(val) || 0 : val;
            calculate();
        }

        function calculate() {
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.getElementById('error-message');
            let errors = [];

            // 1. 計算總食飯錢 (由已付記錄自動加總)
            let totalDinner = 0;
            paidDinnersData.forEach(item => {
                totalDinner += item.amount;
            });
            document.getElementById('total-dinner-display').innerText = `$${totalDinner.toFixed(2)}`;

            // 2. 收集所有玩家及驗證每台零和
            let totalCommission = 0;
            let playerMap = {}; // name -> { wl, paid, isPlaying }

            tablesData.forEach((table, tIndex) => {
                let tableWlSum = 0;
                table.players.forEach(p => {
                    let cleanName = p.name.trim();
                    if (!cleanName) return;
                    tableWlSum += p.wl;
                    if (!playerMap[cleanName]) {
                        playerMap[cleanName] = { wl: 0, paid: 0, isPlaying: true };
                    }
                    playerMap[cleanName].wl += p.wl;
                    playerMap[cleanName].isPlaying = true;
                });

                totalCommission += table.commission;

                // 檢查每台贏輸總和 + 抽水是否等於 0
                let tableCheck = tableWlSum + table.commission;
                if (Math.abs(tableCheck) > 0.01) {
                    errors.push(`第 ${tIndex + 1} 台數目唔對路！玩家贏輸總和 (${tableWlSum}) + 抽水 (${table.commission}) = ${tableCheck} (必須剛好等於 0)`);
                }
            });

            // 把已付飯錢的人加入記錄
            paidDinnersData.forEach(item => {
                let cleanName = item.name.trim();
                if (!cleanName) return;
                if (!playerMap[cleanName]) {
                    playerMap[cleanName] = { wl: 0, paid: 0, isPlaying: false };
                }
                playerMap[cleanName].paid += item.amount;
            });

            // 收集淨係食飯名單
            let pureDinnerInput = document.getElementById('pure-dinners').value;
            let pureNames = pureDinnerInput.split(',').map(s => s.trim()).filter(s => s.length > 0);
            pureNames.forEach(name => {
                if (!playerMap[name]) {
                    playerMap[name] = { wl: 0, paid: 0, isPlaying: false };
                }
            });

            // 顯示或隱藏錯誤
            if (errors.length > 0) {
                errorContainer.classList.remove('hidden');
                errorMessage.innerHTML = errors.join('<br>');
            } else {
                errorContainer.classList.add('hidden');
            }

            // 3. 計算抽水與飯錢差額
            let balanceDiff = totalDinner - totalCommission;
            let dinnerMode = document.getElementById('dinner-mode').value;

            let allDinnerNames = Object.keys(playerMap);
            let totalDinnerPeopleCount = allDinnerNames.length;

            let finalShares = {};

            if (balanceDiff > 0) {
                // 抽水唔夠畀飯錢
                if (dinnerMode === 'subsidy') {
                    let sharePerPerson = balanceDiff / totalDinnerPeopleCount;
                    allDinnerNames.forEach(name => {
                        finalShares[name] = sharePerPerson;
                    });
                } else {
                    let pureShare = totalDinner / totalDinnerPeopleCount;
                    let playingNames = Object.keys(playerMap).filter(n => playerMap[n].isPlaying);
                    let nonPlayingNames = pureNames.filter(n => !playerMap[n].isPlaying);

                    nonPlayingNames.forEach(name => {
                        finalShares[name] = pureShare;
                    });

                    let remainingForPlayers = totalDinner - (pureShare * nonPlayingNames.length) - totalCommission;
                    let playerShare = playingNames.length > 0 ? remainingForPlayers / playingNames.length : 0;
                    
                    playingNames.forEach(name => {
                        finalShares[name] = playerShare;
                    });

                    // 對於有打牌但同時在 pureNames 裡面的人，按打牌者分攤
                    allDinnerNames.forEach(name => {
                        if (playerMap[name].isPlaying) {
                            finalShares[name] = playerShare;
                        } else if (!finalShares[name]) {
                            finalShares[name] = pureShare;
                        }
                    });
                }
            } else {
                // 抽水多過飯錢，多出嚟嘅金額平均分比有打麻雀嘅人
                let extraMoney = -balanceDiff;
                let playingNames = Object.keys(playerMap).filter(n => playerMap[n].isPlaying);
                let extraPerPlayer = playingNames.length > 0 ? extraMoney / playingNames.length : 0;

                allDinnerNames.forEach(name => {
                    finalShares[name] = 0;
                });

                playingNames.forEach(name => {
                    finalShares[name] = -extraPerPlayer;
                });
            }

            // 4. 計算每個人的最終結果
            let results = {};
            allDinnerNames.forEach(name => {
                let p = playerMap[name];
                let share = finalShares[name] || 0;
                let net = p.wl - share + p.paid;
                results[name] = {
                    wl: p.wl,
                    share: share,
                    paid: p.paid,
                    net: net
                };
            });

            // 更新畫面總覽
            document.getElementById('res-total-commission').innerText = `$${totalCommission.toFixed(2)}`;
            document.getElementById('res-total-dinner').innerText = `$${totalDinner.toFixed(2)}`;
            document.getElementById('res-balance-diff').innerText = `$${balanceDiff.toFixed(2)} ${balanceDiff > 0 ? '(需額外分擔)' : '(抽水有突)'}`;

            // 填入表格
            let tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = '';
            for (let name in results) {
                let r = results[name];
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-medium text-slate-800">${name}</td>
                        <td class="p-3 ${r.wl > 0 ? 'text-emerald-600 font-semibold' : r.wl < 0 ? 'text-rose-600 font-semibold' : 'text-slate-500'}">${r.wl > 0 ? '+' : ''}${r.wl.toFixed(2)}</td>
                        <td class="p-3 text-slate-600">-${r.share.toFixed(2)}</td>
                        <td class="p-3 text-indigo-600 font-medium">+${r.paid.toFixed(2)}</td>
                        <td class="p-3 text-right font-bold ${r.net > 0 ? 'text-emerald-600' : r.net < 0 ? 'text-rose-600' : 'text-slate-500'}">${r.net > 0 ? '+' : ''}${r.net.toFixed(2)}</td>
                    </tr>
                `;
            }

            // 5. 計算轉賬路徑
            let debtors = [];
            let creditors = [];
            for (let name in results) {
                let net = results[name].net;
                if (net < -0.01) debtors.push({ name: name, amount: -net });
                if (net > 0.01) creditors.push({ name: name, amount: net });
            }

            let txList = document.getElementById('transactions-list');
            txList.innerHTML = '';
            let txCount = 0;

            let dIdx = 0, cIdx = 0;
            while (dIdx < debtors.length && cIdx < creditors.length) {
                let debtor = debtors[dIdx];
                let creditor = creditors[cIdx];
                let amt = Math.min(debtor.amount, creditor.amount);

                txList.innerHTML += `<li class="flex items-center space-x-2"><span>👉</span><span class="font-semibold text-slate-800">${debtor.name}</span> 付 <span class="font-semibold text-emerald-600">$${amt.toFixed(2)}</span> 給 <span class="font-semibold text-slate-800">${creditor.name}</span></li>`;
                txCount++;

                debtor.amount -= amt;
                creditor.amount -= amt;

                if (debtor.amount < 0.01) dIdx++;
                if (creditor.amount < 0.01) cIdx++;
            }

            if (txCount === 0) {
                txList.innerHTML = `<li class="text-slate-500 italic">目前所有人結算平衡，無需轉賬。</li>`;
            }

            window.currentResults = results;
        }

        function copyReport() {
            let text = "🀄 麻雀與食飯結算報告\n\n";
            let results = window.currentResults;
            for (let name in results) {
                let r = results[name];
                text += `${name}: ${r.net >= 0 ? '+' : ''}${r.net.toFixed(2)}\n`;
            }
            navigator.clipboard.writeText(text).then(() => {
                alert("已成功複製結算報告到剪貼簿！");
            });
        }
    </script>
</body>
</html>
